name: E000104 tensor-train lifecycle quotient reduction

on:
  push:
    branches:
      - research/e000051-clean-bystanders
    paths:
      - 'docs/novelty/e000104-tensor-train-lifecycle-quotient-reduction.md'
      - 'so/experiments/e000104_tensor_train_lifecycle_quotient_reduction.py'
      - 'so/tests/test_e000104_tensor_train_lifecycle_quotient_reduction.py'
      - '.github/workflows/e000104-tensor-train-lifecycle-quotient-reduction.yml'
  workflow_dispatch:

jobs:
  exact-reduction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile so/experiments/e000104_tensor_train_lifecycle_quotient_reduction.py
      - name: Focused regressions
        run: python -m pytest -q so/tests/test_e000104_tensor_train_lifecycle_quotient_reduction.py
      - name: Registered exact assay
        run: |
          mkdir -p ci-e104
          python -m so.experiments.e000104_tensor_train_lifecycle_quotient_reduction \
            --seed-count 16 --sessions 16 --results-dir ci-e104 | tee ci-e104/stdout.txt
      - name: Hash evidence
        run: |
          sha256sum docs/novelty/e000104-tensor-train-lifecycle-quotient-reduction.md \
            so/experiments/e000104_tensor_train_lifecycle_quotient_reduction.py \
            so/tests/test_e000104_tensor_train_lifecycle_quotient_reduction.py \
            > ci-e104/source-sha256.txt
          find ci-e104 -maxdepth 1 -name '*.json' -print0 | sort -z | xargs -0 -r sha256sum > ci-e104/result-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: e000104-tensor-train-lifecycle-quotient-reduction
          path: ci-e104/
          if-no-files-found: error
