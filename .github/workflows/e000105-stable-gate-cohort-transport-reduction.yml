name: E000105 stable-gate cohort transport reduction

on:
  push:
    branches:
      - research/e000051-clean-bystanders
    paths:
      - 'docs/novelty/e000105-stable-gate-cohort-transport-reduction.md'
      - 'so/experiments/e000105_stable_gate_cohort_transport_reduction.py'
      - 'so/tests/test_e000105_stable_gate_cohort_transport_reduction.py'
      - '.github/workflows/e000105-stable-gate-cohort-transport-reduction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-reduction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile so/experiments/e000105_stable_gate_cohort_transport_reduction.py
      - name: Focused regressions
        run: python -m pytest -q so/tests/test_e000105_stable_gate_cohort_transport_reduction.py
      - name: Registered exact assay
        run: |
          mkdir -p ci-e105
          python -m so.experiments.e000105_stable_gate_cohort_transport_reduction \
            --seed-count 16 --sessions 32 --results-dir ci-e105 | tee ci-e105/stdout.txt
      - name: Hash evidence
        run: |
          sha256sum docs/novelty/e000105-stable-gate-cohort-transport-reduction.md \
            so/experiments/e000105_stable_gate_cohort_transport_reduction.py \
            so/tests/test_e000105_stable_gate_cohort_transport_reduction.py \
            > ci-e105/source-sha256.txt
          find ci-e105 -maxdepth 1 -name '*.json' -print0 | sort -z | xargs -0 -r sha256sum > ci-e105/result-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: e000105-stable-gate-cohort-transport-reduction
          path: ci-e105/
          if-no-files-found: error
