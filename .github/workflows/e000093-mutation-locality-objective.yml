name: E000093 mutation-locality objective
on:
  push:
    branches: [research/e000093-mutation-locality-objective]
    paths:
      - 'so/experiments/e000093_mutation_locality_objective.py'
      - 'docs/novelty/e000093-preregister.md'
      - '.github/workflows/e000093-mutation-locality-objective.yml'
  workflow_dispatch:
    inputs:
      steps:
        description: 'Training steps per arm'
        required: false
        default: '3000'
      seeds:
        description: 'Space-separated seeds'
        required: false
        default: '0 1 2'
permissions:
  contents: read
jobs:
  smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SO_BOS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r so/requirements.txt
      - name: Run E93 smoke seed
        run: |
          mkdir -p ci-e93
          python -m so.experiments.e000093_mutation_locality_objective \
            --seeds 0 --steps 600 --groups 100 --threads 2 --results-dir ci-e93
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e000093-smoke-s0
          path: ci-e93/
          if-no-files-found: warn
  full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SO_BOS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r so/requirements.txt
      - name: Run preregistered E93
        run: |
          mkdir -p ci-e93
          python -m so.experiments.e000093_mutation_locality_objective \
            --seeds ${{ inputs.seeds }} --steps ${{ inputs.steps }} --groups 100 --threads 2 --results-dir ci-e93
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e000093-full
          path: ci-e93/
          if-no-files-found: warn
