name: E000091 certified response domains
on:
  push:
    branches: [research/e000091-certified-response-domains]
    paths:
      - so/experiments/e000091_certified_response_domains.py
      - so/tests/test_e000091_certified_response_domains.py
      - .github/workflows/e000091-certified-response-domains.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  response-domains:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install numpy==2.3.5 pytest==9.0.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Five-seed exact finite-response screen and independent regressions
        run: |
          set -euo pipefail
          mkdir -p ci-e91
          python -m so.experiments.e000091_certified_response_domains --seeds 0 1 2 3 4 --output ci-e91/results.json | tee ci-e91/run.txt
          python -m pytest so/tests/test_e000091_certified_response_domains.py -q -ra | tee ci-e91/pytest.txt
          python -m pip freeze > ci-e91/environment.txt
          sha256sum so/experiments/e000091_certified_response_domains.py so/tests/test_e000091_certified_response_domains.py ci-e91/results.json > ci-e91/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e000091-certified-response-domains
          path: ci-e91/
          if-no-files-found: error
