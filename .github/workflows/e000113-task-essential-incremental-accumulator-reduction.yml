name: E000113 task-essential incremental accumulator reduction

on:
  push:
    branches:
      - research/e000051-clean-bystanders
    paths:
      - "docs/novelty/e000113-task-essential-incremental-accumulator-reduction.md"
      - "so/experiments/e000113_task_essential_incremental_accumulator_reduction.py"
      - "so/tests/test_e000113_task_essential_incremental_accumulator_reduction.py"
      - ".github/workflows/e000113-task-essential-incremental-accumulator-reduction.yml"
  workflow_dispatch:

jobs:
  reduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile so/experiments/e000113_task_essential_incremental_accumulator_reduction.py
      - name: Focused regressions
        run: python -m pytest -q so/tests/test_e000113_task_essential_incremental_accumulator_reduction.py
      - name: Registered exact reduction
        run: |
          mkdir -p ci-e113
          python -m so.experiments.e000113_task_essential_incremental_accumulator_reduction \
            --results-dir ci-e113 | tee ci-e113/stdout.txt
      - name: Hash evidence
        run: |
          sha256sum docs/novelty/e000113-task-essential-incremental-accumulator-reduction.md \
            so/experiments/e000113_task_essential_incremental_accumulator_reduction.py \
            so/tests/test_e000113_task_essential_incremental_accumulator_reduction.py \
            > ci-e113/source-sha256.txt
          find ci-e113 -maxdepth 1 -name '*.json' -print0 | sort -z | xargs -0 -r sha256sum > ci-e113/result-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: e000113-task-essential-incremental-accumulator-reduction
          path: ci-e113/
          if-no-files-found: error
