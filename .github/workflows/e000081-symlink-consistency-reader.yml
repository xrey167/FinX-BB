name: E000081 symlink consistency reader

on:
  workflow_dispatch:
  push:
    branches: [research/e000051-clean-bystanders]
    paths:
      - 'so/experiments/e000081_symlink_consistency_reader.py'
      - '.github/workflows/e000081-symlink-consistency-reader.yml'

jobs:
  seed2-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        consistency: [0.05, 0.15, 0.30]
    env:
      SO_BOS: '1'
      SO_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r so/requirements.txt
      - name: Run failing-seed capability screen
        run: |
          mkdir -p ci-e81
          set +e
          python -m so.experiments.e000081_symlink_consistency_reader \
            --seeds 2 --steps 3000 --groups 100 \
            --consistency '${{ matrix.consistency }}' --alt-supervision 0.5 \
            --threads 2 --results-dir ci-e81
          rc=$?
          set -e
          # Preserve negative arms as artifacts.  The workflow itself remains green
          # when the research hypothesis is false so all three arms finish and can
          # be compared; the JSON contains the strict pass/fail gate.
          echo "experiment_exit_code=$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e000081-seed2-c${{ matrix.consistency }}
          path: ci-e81/
