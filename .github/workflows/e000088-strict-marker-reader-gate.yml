name: E000088 strict marker reader gate
on:
  push:
    branches: [research/e000088-strict-marker-reader-gate]
    paths:
      - 'so/experiments/e000088_strict_marker_reader_gate.py'
      - '.github/workflows/e000088-strict-marker-reader-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-reader:
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SO_BOS: '1'
      SO_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r so/requirements.txt
      - name: Run strict-marker real-symlink seed gate
        run: |
          mkdir -p ci-e88
          python -m so.experiments.e000088_strict_marker_reader_gate \
            --seeds ${{ matrix.seed }} --steps 3000 --groups 100 --template 9 --threads 2 \
            --results-dir ci-e88
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e000088-strict-marker-reader-s${{ matrix.seed }}
          path: ci-e88/
          if-no-files-found: warn
