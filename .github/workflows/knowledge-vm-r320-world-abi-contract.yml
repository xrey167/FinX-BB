name: Knowledge VM R320 CKCA V3 World ABI

on:
  push:
    branches:
      - research/ckca-world-abi-v3-r320-20260914
  workflow_dispatch:

jobs:
  r320-world-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SO_R320_REPORT: ci-r320/report.json
      SO_R320_PODS: 20000
      SO_R320_PLANS: 5000
      SO_R320_TRANSACTIONS: 200000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run R320 CKCA V3 World ABI contract gate
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          mkdir -p ci-r320
          python -m research.r320_world_abi_integrated_contract 2>&1 | tee ci-r320/stdout.log
      - name: Upload R320 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-vm-r320-world-abi
          path: ci-r320/
          retention-days: 30
