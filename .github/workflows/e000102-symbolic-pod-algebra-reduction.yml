name: E000102 symbolic Pod algebra reduction
on:
  push:
    branches: [research/e000051-clean-bystanders]
    paths:
      - 'so/experiments/e000102_symbolic_pod_algebra_reduction.py'
      - 'so/tests/test_e000102_symbolic_pod_algebra_reduction.py'
      - 'docs/novelty/e000102-symbolic-pod-algebra-reduction-preregister.md'
      - '.github/workflows/e000102-symbolic-pod-algebra-reduction.yml'
  workflow_dispatch:
jobs:
  reduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile registered source
        run: python -m py_compile so/experiments/e000102_symbolic_pod_algebra_reduction.py
      - name: Run focused regressions
        run: python -m pytest -q so/tests/test_e000102_symbolic_pod_algebra_reduction.py
      - name: Run registered exact reduction
        run: |
          mkdir -p ci-e102
          python -m so.experiments.e000102_symbolic_pod_algebra_reduction \
            --seed-count 16 --sizes 4 6 8 10 12 --results-dir ci-e102 \
            | tee ci-e102/stdout.txt
      - name: Hash evidence
        run: |
          sha256sum docs/novelty/e000102-symbolic-pod-algebra-reduction-preregister.md \
            so/experiments/e000102_symbolic_pod_algebra_reduction.py \
            so/tests/test_e000102_symbolic_pod_algebra_reduction.py \
            > ci-e102/source-sha256.txt
          find ci-e102 -maxdepth 1 -name '*.json' -print0 | sort -z | xargs -0 -r sha256sum > ci-e102/result-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: e000102-symbolic-pod-algebra-reduction
          path: ci-e102/
