name: CAVI clean-prefix write-only scope pilot
on:
  push:
    branches: [research/cavi-continuation-audit]
    paths: ['.github/workflows/cavi-write-scope.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2]
    env:
      SO_BOS: '1'
      SO_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install recorded CPU dependencies
        run: |
          python -m pip install 'torch==2.14.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==5.16.1' numpy
          python -m pip freeze > environment.txt
          python -m py_compile so/experiments/cavi_write_scope.py
      - name: Obtain retained E79 checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 33961782977 --repo xrey167/FinX-BB --name e000079-joint-s${{ matrix.seed }} --dir parent
      - name: Validate unchanged positive path then calibrate write-only scope
        run: python -m so.experiments.cavi_write_scope --checkpoint parent/ci-e79/e000079-s${{ matrix.seed }}.pt --output results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cavi-write-scope-s${{ matrix.seed }}
          path: |
            results/
            environment.txt
          retention-days: 30
          if-no-files-found: error
