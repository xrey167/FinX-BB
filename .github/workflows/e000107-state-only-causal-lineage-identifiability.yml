name: E000107 state-only causal-lineage identifiability

on:
  push:
    branches:
      - research/e000051-clean-bystanders
    paths:
      - "docs/novelty/e000107-state-only-causal-lineage-identifiability.md"
      - "so/experiments/e000107_state_only_causal_lineage_identifiability.py"
      - "so/tests/test_e000107_state_only_causal_lineage_identifiability.py"
      - ".github/workflows/e000107-state-only-causal-lineage-identifiability.yml"
  workflow_dispatch:

jobs:
  reduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile so/experiments/e000107_state_only_causal_lineage_identifiability.py
      - name: Focused regressions
        run: python -m pytest -q so/tests/test_e000107_state_only_causal_lineage_identifiability.py
      - name: Registered exact reduction
        run: |
          mkdir -p ci-e107
          python -m so.experiments.e000107_state_only_causal_lineage_identifiability \
            --results-dir ci-e107 | tee ci-e107/stdout.txt
      - name: Hash evidence
        run: |
          sha256sum docs/novelty/e000107-state-only-causal-lineage-identifiability.md \
            so/experiments/e000107_state_only_causal_lineage_identifiability.py \
            so/tests/test_e000107_state_only_causal_lineage_identifiability.py \
            > ci-e107/source-sha256.txt
          find ci-e107 -maxdepth 1 -name '*.json' -print0 | sort -z | xargs -0 -r sha256sum > ci-e107/result-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: e000107-state-only-causal-lineage-identifiability
          path: ci-e107/
          if-no-files-found: error
