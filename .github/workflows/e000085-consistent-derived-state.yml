name: E000085 consistent reader downstream stale-state

on:
  push:
    branches: [research/e000051-clean-bystanders]
    paths:
      - 'so/experiments/e000085_consistent_reader_derived_state.py'
      - '.github/workflows/e000085-consistent-derived-state.yml'
  workflow_dispatch:

jobs:
  attack:
    strategy:
      fail-fast: false
      matrix:
        mode: [hidden, router_payload]
        seed: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SO_BOS: '1'
      SO_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r so/requirements.txt
      - name: Strict-capability downstream replay battery
        run: |
          mkdir -p ci-e85
          python -m so.experiments.e000085_consistent_reader_derived_state \
            --mode '${{ matrix.mode }}' --seed '${{ matrix.seed }}' \
            --steps 3000 --groups 100 --consistency 0.15 --alt-supervision 0.5 \
            --threads 2 --results-dir ci-e85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e000085-${{ matrix.mode }}-s${{ matrix.seed }}
          path: ci-e85/
