name: E000112 finite Koopman receipt reduction

on:
  push:
    branches:
      - research/e000051-clean-bystanders
    paths:
      - "docs/novelty/e000112-finite-koopman-receipt-reduction.md"
      - "so/experiments/e000112_finite_koopman_receipt_reduction.py"
      - "so/tests/test_e000112_finite_koopman_receipt_reduction.py"
      - ".github/workflows/e000112-finite-koopman-receipt-reduction.yml"
  workflow_dispatch:

jobs:
  reduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile so/experiments/e000112_finite_koopman_receipt_reduction.py
      - name: Focused regressions
        run: python -m pytest -q so/tests/test_e000112_finite_koopman_receipt_reduction.py
      - name: Registered exact reduction
        run: |
          mkdir -p ci-e112
          python -m so.experiments.e000112_finite_koopman_receipt_reduction \
            --results-dir ci-e112 | tee ci-e112/stdout.txt
      - name: Hash evidence
        run: |
          sha256sum docs/novelty/e000112-finite-koopman-receipt-reduction.md \
            so/experiments/e000112_finite_koopman_receipt_reduction.py \
            so/tests/test_e000112_finite_koopman_receipt_reduction.py \
            > ci-e112/source-sha256.txt
          find ci-e112 -maxdepth 1 -name '*.json' -print0 | sort -z | xargs -0 -r sha256sum > ci-e112/result-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: e000112-finite-koopman-receipt-reduction
          path: ci-e112/
          if-no-files-found: error
