name: E000078 forward-atomic CAVI contract

on:
  workflow_dispatch:
  push:
    branches: [research/e000051-clean-bystanders]
    paths:
      - 'so/cavi_snapshot.py'
      - 'so/tests/test_cavi_snapshot.py'
      - '.github/workflows/e000078-forward-snapshot-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r so/requirements.txt
      - name: Existing CAVI semantics
        run: python -m pytest so/tests/test_cavi.py -q
      - name: Forward snapshot contract
        run: python -m pytest so/tests/test_cavi_snapshot.py -q
