name: OSL001 mixed-context lineage saturation
on:
  push:
    branches: [research/osl001-mixed-context-saturation]
    paths:
      - so/experiments/osl001_mixed_context_saturation.py
      - so/tests/test_osl001_mixed_context_saturation.py
      - .github/workflows/osl001-mixed-context-saturation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r so/requirements.txt
      - name: Execute falsifier and regressions
        run: |
          set -euo pipefail
          mkdir -p ci-osl001
          python -m so.experiments.osl001_mixed_context_saturation --output ci-osl001/results.json | tee ci-osl001/run.txt
          python -m pytest so/tests/test_osl001_mixed_context_saturation.py -q -ra | tee ci-osl001/pytest.txt
          python -m pip freeze > ci-osl001/environment.txt
          sha256sum so/experiments/osl001_mixed_context_saturation.py so/tests/test_osl001_mixed_context_saturation.py ci-osl001/results.json > ci-osl001/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osl001-mixed-context-saturation
          path: ci-osl001/
          if-no-files-found: error
