name: E000089 cross-model generation attestation
on:
  push:
    branches: [research/e000051-clean-bystanders]
    paths:
      - 'so/experiments/e000089_cross_model_generation_attestation.py'
      - '.github/workflows/e000089-cross-model-generation-attestation.yml'
  workflow_dispatch:
jobs:
  structural-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r so/requirements.txt
      - name: E-000089 structural cross-model screen
        env:
          SO_THREADS: '2'
        run: |
          mkdir -p ci-e89
          python -m so.experiments.e000089_cross_model_generation_attestation \
            --models distilgpt2 EleutherAI/pythia-70m \
            --seeds 0 1 2 --payload-rms 4.0 --results-dir ci-e89
      - uses: actions/upload-artifact@v4
        with:
          name: e000089-cross-model
          path: ci-e89/
