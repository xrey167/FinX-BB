name: E000087B strict alias fanout
on:
  push:
    branches: [research/e000087-marker-validity-contract]
    paths:
      - 'so/experiments/e000087b_strict_alias_fanout.py'
      - '.github/workflows/e000087b-strict-alias-fanout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-fanout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy
      - name: Run strict fanout screen
        run: |
          mkdir -p ci-e87b
          python -m so.experiments.e000087b_strict_alias_fanout \
            --seeds 0 1 2 3 4 --fanouts 1 2 4 8 16 32 64 --rounds 11 \
            --results-dir ci-e87b
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e000087b-strict-alias-fanout
          path: ci-e87b/
          if-no-files-found: error
