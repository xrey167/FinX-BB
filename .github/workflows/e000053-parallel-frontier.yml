name: E000053 parallel frontier
on:
  push:
    branches: [research/e000051-clean-bystanders]
    paths:
      - 'so/experiments/e000053_parallel_frontier.py'
      - '.github/workflows/e000053-parallel-frontier.yml'
  workflow_dispatch:

jobs:
  frontier:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: full, generic: 0.25, seed: 0}
          - {variant: full, generic: 0.50, seed: 0}
          - {variant: full, generic: 0.75, seed: 0}
          - {variant: full, generic: 0.50, seed: 1}
          - {variant: match_only, generic: 0.50, seed: 0}
          - {variant: null_only, generic: 0.50, seed: 0}
          - {variant: plain, generic: 0.50, seed: 0}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r so/requirements.txt
      - name: Frontier arm
        env:
          SO_THREADS: 2
        run: |
          mkdir -p ci-e53
          python -m so.experiments.e000053_parallel_frontier \
            --variant '${{ matrix.variant }}' \
            --generic-share '${{ matrix.generic }}' \
            --seed '${{ matrix.seed }}' \
            --steps 1200 --threads 2 --results-dir ci-e53
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e53-${{ matrix.variant }}-g${{ matrix.generic }}-s${{ matrix.seed }}
          path: ci-e53/
