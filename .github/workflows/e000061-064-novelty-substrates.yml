name: E000061-064 novelty substrates

on:
  push:
    branches: [research/e000051-clean-bystanders]
    paths:
      - 'so/experiments/e000061_pod_closure_scaling.py'
      - 'so/experiments/e000064_versioned_symlink_semantics.py'
      - 'so/closure.py'
      - 'so/mvcc.py'
      - '.github/workflows/e000061-064-novelty-substrates.yml'
  workflow_dispatch:

jobs:
  substrate:
    strategy:
      fail-fast: false
      matrix:
        experiment: [e61, e64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
      - name: Run substrate
        shell: bash
        run: |
          mkdir -p ci-novelty
          if [ '${{ matrix.experiment }}' = 'e61' ]; then
            python -m so.experiments.e000061_pod_closure_scaling --results-dir ci-novelty
          else
            python -m so.experiments.e000064_versioned_symlink_semantics --results-dir ci-novelty
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: novelty-${{ matrix.experiment }}
          path: ci-novelty/
