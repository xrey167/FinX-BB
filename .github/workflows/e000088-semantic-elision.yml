name: E000088 semantic dependency elision
on:
  push:
    branches: [research/e000051-clean-bystanders]
    paths:
      - 'so/experiments/e000088_semantic_dependency_elision.py'
      - '.github/workflows/e000088-semantic-elision.yml'
  workflow_dispatch:
jobs:
  kill-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r so/requirements.txt
      - name: E-000088 exhaustive payload-domain kill screen
        env:
          SO_THREADS: '2'
        run: |
          mkdir -p ci-e88
          python -m so.experiments.e000088_semantic_dependency_elision \
            --seeds ${{ matrix.seed }} --steps 4000 --n-pods 8 --n-queries 3 \
            --threads 2 --results-dir ci-e88
      - uses: actions/upload-artifact@v4
        with:
          name: e000088-s${{ matrix.seed }}
          path: ci-e88/
# Explicit trigger commit after workflow registration; scientific protocol unchanged.
