name: Knowledge VM Qwen3 R284 response capsule

on:
  push:
    branches:
      - research/knowledge-vm-real-gate-20260913
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_XET: "1"
  TOKENIZERS_PARALLELISM: "false"
  SO_R284_REPORT: ci-qwen-r284/report.json
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  qwen3-r284:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned Qwen3 CPU runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.51.3 tokenizers==0.21.4 safetensors huggingface_hub
      - name: Run R284 response capsule gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-qwen-r284
          python -m research.qwen3_knowledge_vm_r284_response_capsule 2>&1 | tee ci-qwen-r284/stdout.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-vm-qwen3-r284-response-capsule
          path: ci-qwen-r284/
          retention-days: 30
          if-no-files-found: warn
