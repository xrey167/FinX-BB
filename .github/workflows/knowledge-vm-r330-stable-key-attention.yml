name: Knowledge VM R330 Stable-Key World Attention

on:
  push:
    branches:
      - research/ckca-stable-key-attention-r330-20260914
  workflow_dispatch:

jobs:
  r330-stable-key-attention:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SO_R330_REPORT: ci-r330/report.json
      SO_R330_PODS: 2048
      SO_R330_QUERIES: 2048
      SO_R330_DIM: 32
      SO_R330_TOPK: 4
      SO_R330_UPDATES: 5000
      SO_R330_PROBES_PER_UPDATE: 8
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run R330 stable-key world-attention gate
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          mkdir -p ci-r330
          python -m research.r330_indirection_stable_world_attention 2>&1 | tee ci-r330/stdout.log
      - name: Upload R330 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-vm-r330-stable-key-attention
          path: ci-r330/
          retention-days: 30
