name: RSI001 revision sufficient state
on:
  push:
    branches: [research/rsi001-revision-sufficient-state]
    paths:
      - so/experiments/rsi001_revision_sufficient_state.py
      - so/tests/test_rsi001_revision_sufficient_state.py
      - .github/workflows/rsi001-revision-sufficient-state.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install numpy==2.3.5 pytest==9.0.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Execute all exact and five-seed numerical arms
        run: |
          set -euo pipefail
          mkdir -p ci-rsi001
          python -m so.experiments.rsi001_revision_sufficient_state --output ci-rsi001/results.json | tee ci-rsi001/run.txt
          python -m pytest so/tests/test_rsi001_revision_sufficient_state.py -q -ra | tee ci-rsi001/pytest.txt
          python -m pip freeze > ci-rsi001/environment.txt
          sha256sum so/experiments/rsi001_revision_sufficient_state.py so/tests/test_rsi001_revision_sufficient_state.py ci-rsi001/results.json > ci-rsi001/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rsi001-revision-sufficient-state
          path: ci-rsi001/
          if-no-files-found: error
