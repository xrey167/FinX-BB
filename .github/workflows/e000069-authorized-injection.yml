name: E000069 authorized injection boundary

on:
  push:
    branches: [research/e000051-clean-bystanders]
    paths:
      - 'so/experiments/e000069_authorized_injection_boundary.py'
      - 'so/authorized_memory.py'
      - 'so/incarnation.py'
      - 'so/llm_adapter.py'
      - '.github/workflows/e000069-authorized-injection.yml'
  workflow_dispatch:

jobs:
  authorized-injection:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r so/requirements.txt
      - name: E-000069 interface replay barrier
        env:
          SO_THREADS: '2'
        run: |
          mkdir -p ci-e69
          python -m so.experiments.e000069_authorized_injection_boundary --seeds 0 1 2 --threads 2 --results-dir ci-e69
      - uses: actions/upload-artifact@v4
        with:
          name: e000069-authorized-injection
          path: ci-e69/
