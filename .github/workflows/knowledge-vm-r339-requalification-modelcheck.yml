name: Knowledge VM R339 Requalification Model Check

on:
  push:
    branches:
      - research/ckca-requalification-modelcheck-r339-20260914
  workflow_dispatch:

jobs:
  r339-requalification-modelcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SO_R339_REPORT: ci-r339/report.json
      SO_R339_DOMAIN: 4
      SO_R339_DEPTH: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run R339 exhaustive requalification model check
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          mkdir -p ci-r339
          python -m research.r339_requalification_bounded_modelcheck 2>&1 | tee ci-r339/stdout.log
      - name: Upload R339 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-vm-r339-requalification-modelcheck
          path: ci-r339/
          retention-days: 30
