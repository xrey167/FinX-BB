name: Knowledge VM Qwen R257 real reference

on:
  push:
    branches: [research/knowledge-vm-real-gate-20260913]
    paths:
      - 'research/qwen_knowledge_vm_r257.py'
      - '.github/workflows/knowledge-vm-qwen-r257.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen-r257:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      SO_R257_REPORT: ci-qwen-r257/report.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.48.3 tokenizers==0.21.0 safetensors==0.5.2 huggingface_hub==0.28.1
      - name: Run real Qwen AOT Knowledge reference gate
        run: |
          mkdir -p ci-qwen-r257
          python research/qwen_knowledge_vm_r257.py | tee ci-qwen-r257/stdout.log
      - name: Archive R257 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-vm-qwen-r257-real-reference
          path: ci-qwen-r257/
          if-no-files-found: warn
