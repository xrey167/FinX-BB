name: CAVI qualified falsification evidence confirmation
on:
  push:
    branches: [research/cavi-continuation-audit]
    paths: ['.github/workflows/cavi-results-confirmation.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/cavi-continuation-audit
      - name: Verify original archives and retain every negative
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: research/evidence/cavi-confirmed-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from so.experiments import cavi_collect_results as C
          C.RUNS += (33963938909,)
          C.collect(Path(os.environ['OUT']))
          PY
      - name: Append evidence without changing model or thresholds
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/evidence/
          git commit -m 'research: retain verified qualified-reader and scope evidence; no breakthrough claim'
          git pull --rebase origin research/cavi-continuation-audit
          git push origin HEAD:research/cavi-continuation-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cavi-qualified-falsification-evidence-${{ github.run_attempt }}
          path: research/evidence/cavi-confirmed-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
