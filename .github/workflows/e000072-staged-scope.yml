name: E000072 staged scope after capability

on:
  push:
    branches: [research/e000051-clean-bystanders]
    paths:
      - 'so/experiments/e000072_staged_scope_after_capability.py'
      - 'so/experiments/e000060_scope_before_routing.py'
      - 'so/experiments/e000055_relevance_calibration.py'
      - 'so/experiments/e000018_no_key_no_injection.py'
      - 'so/llm_adapter.py'
      - '.github/workflows/e000072-staged-scope.yml'
  workflow_dispatch:

jobs:
  staged-scope:
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r so/requirements.txt
      - name: E-000072 staged scope
        env:
          SO_THREADS: '2'
        run: |
          mkdir -p ci-e72
          python -m so.experiments.e000072_staged_scope_after_capability --seed ${{ matrix.seed }} --steps 1200 --cal-steps 250 --threads 2 --results-dir ci-e72
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e72-seed${{ matrix.seed }}
          path: ci-e72/
