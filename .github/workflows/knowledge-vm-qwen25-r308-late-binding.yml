name: Knowledge VM Qwen2.5 R308 Late Binding

on:
  push:
    branches:
      - research/knowledge-vm-late-binding-r308-20260913
    paths:
      - research/qwen25_05b_r308_late_bound_handle_vm.py
      - .github/workflows/knowledge-vm-qwen25-r308-late-binding.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_XET: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  SO_R308_REPORT: ci-qwen-r308/report.json
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  qwen25-r308-late-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.45.2 tokenizers==0.20.3 huggingface_hub==0.25.2 safetensors==0.4.5
      - name: Run R308 late-bound handle VM gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-qwen-r308
          python -m research.qwen25_05b_r308_late_bound_handle_vm 2>&1 | tee ci-qwen-r308/stdout.log
      - name: Upload R308 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-vm-qwen25-r308-late-binding
          path: ci-qwen-r308/
          retention-days: 30
          if-no-files-found: warn
