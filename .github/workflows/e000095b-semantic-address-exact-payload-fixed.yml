name: E000095B semantic-address exact-payload fixed harness
on:
  push:
    branches: [research/e000095-semantic-address-exact-payload]
    paths:
      - 'so/experiments/e000095b_semantic_address_exact_payload_fixed.py'
      - '.github/workflows/e000095b-semantic-address-exact-payload-fixed.yml'
permissions:
  contents: read
jobs:
  semantic-address-fixed:
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SO_BOS: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r so/requirements.txt
      - name: Compile fixed wrapper and original assay
        run: |
          python -m py_compile so/experiments/e000095_semantic_address_exact_payload.py
          python -m py_compile so/experiments/e000095b_semantic_address_exact_payload_fixed.py
      - name: Run unchanged preregistered E95 assay through fixed wrapper
        run: |
          set -o pipefail
          mkdir -p ci-e95b
          python -m so.experiments.e000095b_semantic_address_exact_payload_fixed \
            --seeds ${{ matrix.seed }} --steps 3000 --groups 100 --threads 2 --results-dir ci-e95b \
            2>&1 | tee ci-e95b/stdout-s${{ matrix.seed }}.txt
      - name: Hash evidence
        if: always()
        run: |
          sha256sum so/experiments/e000095_semantic_address_exact_payload.py so/experiments/e000095b_semantic_address_exact_payload_fixed.py > ci-e95b/source-sha256-s${{ matrix.seed }}.txt
          find ci-e95b -maxdepth 1 -name '*.json' -print0 | sort -z | xargs -0 -r sha256sum > ci-e95b/result-sha256-s${{ matrix.seed }}.txt
          python -m pip freeze > ci-e95b/environment-s${{ matrix.seed }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e000095b-semantic-address-exact-payload-s${{ matrix.seed }}
          path: ci-e95b/
          if-no-files-found: error
