name: Knowledge VM R356 Trainable Reference Program

on:
  push:
    branches:
      - research/ckca-learned-reference-program-r356-20260914
  workflow_dispatch:

concurrency:
  group: r356-learned-reference-program-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r356-learned-reference-program:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SO_R356_REPORT: ci-r356/report.json
      SO_R356_PODS: 256
      SO_R356_TRAIN_STEPS: 1600
      SO_R356_BATCH: 512
      SO_R356_DESCRIPTORS: 6000
      SO_R356_FUTURE_WORLDS: 64
      SO_R356_UPDATES: 30000
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.3
      - name: Run R356 learned reference program gate
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          mkdir -p ci-r356
          python -m research.r356_trainable_reference_generating_program 2>&1 | tee ci-r356/stdout.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-vm-r356-learned-reference-program
          path: ci-r356/
          retention-days: 30
