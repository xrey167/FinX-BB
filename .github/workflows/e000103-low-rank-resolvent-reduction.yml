name: E000103 low-rank resolvent lifecycle reduction

on:
  push:
    branches:
      - research/e000051-clean-bystanders
    paths:
      - 'docs/novelty/e000103-low-rank-resolvent-lifecycle-reduction.md'
      - 'so/experiments/e000103_low_rank_resolvent_lifecycle_reduction.py'
      - 'so/tests/test_e000103_low_rank_resolvent_lifecycle_reduction.py'
      - '.github/workflows/e000103-low-rank-resolvent-reduction.yml'
  workflow_dispatch:

jobs:
  exact-reduction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile so/experiments/e000103_low_rank_resolvent_lifecycle_reduction.py
      - name: Focused regressions
        run: python -m pytest -q so/tests/test_e000103_low_rank_resolvent_lifecycle_reduction.py
      - name: Registered exact assay
        run: |
          mkdir -p ci-e103
          python -m so.experiments.e000103_low_rank_resolvent_lifecycle_reduction \
            --seed-count 16 --results-dir ci-e103 | tee ci-e103/stdout.txt
      - name: Hash evidence
        run: |
          sha256sum docs/novelty/e000103-low-rank-resolvent-lifecycle-reduction.md \
            so/experiments/e000103_low_rank_resolvent_lifecycle_reduction.py \
            so/tests/test_e000103_low_rank_resolvent_lifecycle_reduction.py \
            > ci-e103/source-sha256.txt
          find ci-e103 -maxdepth 1 -name '*.json' -print0 | sort -z | xargs -0 -r sha256sum > ci-e103/result-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: e000103-low-rank-resolvent-lifecycle-reduction
          path: ci-e103/
          if-no-files-found: error
