name: Knowledge VM R315 Counterfactual World Swap

on:
  push:
    branches:
      - research/knowledge-vm-world-swap-r315-20260914
  workflow_dispatch:

jobs:
  r315-world-swap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SO_R315_REPORT: ci-r315/report.json
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run R315 counterfactual world-swap gate
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          mkdir -p ci-r315
          python -m research.r315_counterfactual_world_swap_training 2>&1 | tee ci-r315/stdout.log
      - name: Upload R315 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-vm-r315-world-swap
          path: ci-r315/
          retention-days: 30
