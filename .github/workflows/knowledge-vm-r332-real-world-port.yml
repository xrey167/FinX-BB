name: Knowledge VM R332 Real Pretrained World Port

on:
  push:
    branches:
      - research/ckca-real-world-port-r332-20260914
  workflow_dispatch:

jobs:
  r332-real-world-port:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_XET: 1
      HF_HUB_DISABLE_TELEMETRY: 1
      TOKENIZERS_PARALLELISM: false
      SO_R332_REPORT: ci-r332/report.json
      SO_R332_TRAIN_PROMPTS_PER_OP: 96
      SO_R332_EVAL_PROMPTS_PER_OP: 64
      SO_R332_J_STEPS: 1400
      SO_R332_J_BATCH: 512
      SO_R332_ENCODE_BATCH: 32
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.45.2 tokenizers==0.20.3 huggingface_hub==0.25.2 safetensors==0.4.5
      - name: Run R332 real pretrained World Port gate
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          mkdir -p ci-r332
          python -m research.qwen25_05b_r332_terminal_world_port 2>&1 | tee ci-r332/stdout.log
      - name: Upload R332 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-vm-r332-real-world-port
          path: ci-r332/
          retention-days: 30
