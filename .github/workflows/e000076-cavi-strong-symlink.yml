name: E000076 CAVI strong symlink boundary

on:
  push:
    branches: [research/e000051-clean-bystanders]
    paths:
      - 'so/experiments/e000070_cavi_live_symlink_boundary.py'
      - 'so/experiments/e000020_symlink_gpt2.py'
      - 'so/cavi.py'
      - '.github/workflows/e000076-cavi-strong-symlink.yml'
  workflow_dispatch:

jobs:
  strong-cavi:
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r so/requirements.txt
      - name: CAVI unit semantics
        run: python -m pytest so/tests/test_cavi.py -q
      - name: E-000076 strong real-symlink CAVI boundary
        env:
          SO_THREADS: '2'
        run: |
          mkdir -p ci-e76
          python -m so.experiments.e000070_cavi_live_symlink_boundary \
            --seeds ${{ matrix.seed }} --steps 3000 --groups 24 --template 9 --threads 2 --results-dir ci-e76
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e000076-cavi-strong-symlink-s${{ matrix.seed }}
          path: ci-e76/
