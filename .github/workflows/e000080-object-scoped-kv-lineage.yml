name: E000080 object-scoped KV lineage

on:
  workflow_dispatch:
  push:
    branches: [research/e000051-clean-bystanders]
    paths:
      - 'so/derived_lineage.py'
      - 'so/tests/test_derived_lineage.py'
      - 'so/experiments/e000080_object_scoped_kv_lineage.py'
      - '.github/workflows/e000080-object-scoped-kv-lineage.yml'

jobs:
  lineage-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r so/requirements.txt
      - name: Test object-scoped lineage contract
        run: pytest -q so/tests/test_derived_lineage.py so/tests/test_cavi.py so/tests/test_cavi_snapshot.py

  real-kv-selective-reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        model:
          - distilgpt2
          - EleutherAI/pythia-70m-deduped
    env:
      SO_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r so/requirements.txt
      - name: Run three-seed selective KV reuse test
        run: |
          mkdir -p ci-e80
          python -m so.experiments.e000080_object_scoped_kv_lineage \
            --model '${{ matrix.model }}' --seeds 0 1 2 --payload-rms 4.0 \
            --results-dir ci-e80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e000080-${{ strategy.job-index }}
          path: ci-e80/
