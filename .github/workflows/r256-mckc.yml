name: r256-mckc-real-qwen

on:
  push:
    branches:
      - research/knowledge-vm-real-gate-20260913
    paths:
      - 'research/knowledge_vm/r256_mckc_qwen3.py'
      - '.github/workflows/r256-mckc.yml'
  workflow_dispatch:

jobs:
  r256:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.8.0' 'transformers==4.56.2' 'safetensors>=0.5' 'huggingface_hub>=0.34'
      - name: Run R256
        run: python research/knowledge_vm/r256_mckc_qwen3.py 2>&1 | tee r256.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r256-mckc-evidence
          path: |
            r256_results.json
            r256.log
          if-no-files-found: warn
