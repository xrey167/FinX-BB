name: CAVI fixed-budget capability continuation
on:
  push:
    branches: [research/cavi-continuation-audit]
    paths: ['.github/workflows/cavi-capability-continuation.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backbone: [gpt2, pythia]
        seed: [0, 1, 2]
    env:
      SO_BOS: '1'
      SO_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install recorded CPU versions
        run: |
          python -m pip install 'torch==2.14.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==5.16.1' numpy pytest
          python -m pip freeze > environment.txt
          python -m py_compile so/experiments/cavi_capability_continuation.py
      - name: Run current runtime regressions
        run: python -m pytest so/tests/test_cavi.py so/tests/test_cavi_snapshot.py so/tests/test_last_token_adapter.py -q
      - name: Obtain immutable E79 parent
        if: matrix.backbone == 'gpt2'
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if gh run download 33961782977 --repo xrey167/FinX-BB --name "e000079-joint-s${SEED}" --dir parent; then
              test -f "parent/ci-e79/e000079-s${SEED}.pt"
              sha256sum "parent/ci-e79/e000079-s${SEED}.pt" > parent.sha256
              exit 0
            fi
            sleep 15
          done
          echo 'E79 checkpoint not available within bounded wait' >&2
          exit 1
      - name: Train and audit without relaxing validity
        env:
          SEED: ${{ matrix.seed }}
          BACKBONE: ${{ matrix.backbone }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "$BACKBONE" = gpt2 ]; then EXTRA=(--parent "parent/ci-e79/e000079-s${SEED}.pt"); fi
          python -m so.experiments.cavi_capability_continuation --seed "$SEED" --backbone "$BACKBONE" "${EXTRA[@]}" --output results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cavi-capability-${{ matrix.backbone }}-s${{ matrix.seed }}
          path: |
            results/
            environment.txt
            parent.sha256
          retention-days: 30
          if-no-files-found: error
