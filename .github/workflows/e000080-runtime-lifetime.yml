name: E000080 request lifetime correction
on:
  push:
    branches: [research/e000079-joint-contract]
    paths: ['.github/workflows/e000080-runtime-lifetime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-patch:
    if: github.ref == 'refs/heads/research/e000079-joint-contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/e000079-joint-contract
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded CPU test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==5.16.1' numpy pytest
      - name: Apply reviewed patch and run full regression suite
        run: |
          if git apply --reverse --check so/patches/e000080-runtime-lifetime.patch 2>/dev/null; then
            echo 'Patch already applied'
          else
            git apply --check so/patches/e000080-runtime-lifetime.patch
            git apply --index so/patches/e000080-runtime-lifetime.patch
          fi
          python -m pytest so/tests -q --junitxml=e000080-tests.xml
      - name: Commit only the tested core corrections
        run: |
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: apply tested thread-local request context and outer exception cleanup'
            git push origin HEAD:refs/heads/research/e000079-joint-contract
          fi
          git rev-parse HEAD > e000080-tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e000080-runtime-regressions
          path: |
            e000080-tests.xml
            e000080-tested-commit.txt
          retention-days: 30
          if-no-files-found: error
