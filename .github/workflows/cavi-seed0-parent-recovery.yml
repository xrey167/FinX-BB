name: CAVI seed-zero parent-availability recovery
on:
  push:
    branches: [research/cavi-continuation-audit]
    paths: ['.github/workflows/cavi-seed0-parent-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SO_BOS: '1'
      SO_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install recorded CPU dependencies
        run: |
          python -m pip install 'torch==2.14.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==5.16.1' numpy
          python -m pip freeze > environment.txt
      - name: Obtain now-published immutable parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 33961782977 --repo xrey167/FinX-BB --name e000079-joint-s0 --dir parent
      - name: Same seed-zero continuation; do not replace the timeout artifact
        run: |
          set +e
          python -m so.experiments.cavi_capability_continuation --seed 0 --backbone gpt2 --parent parent/ci-e79/e000079-s0.pt --output reader
          STATUS=$?
          echo "$STATUS" > reader-exit-code.txt
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 2 ] && [ "$STATUS" -ne 3 ]; then exit "$STATUS"; fi
          test -f reader/reader.pt
      - name: Unchanged qualified-reader provenance audit
        run: python -m so.experiments.cavi_provenance_audit --checkpoint reader/reader.pt --output provenance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cavi-gpt2-seed0-recovery
          path: |
            reader/
            provenance/
            reader-exit-code.txt
            environment.txt
          retention-days: 30
          if-no-files-found: error
