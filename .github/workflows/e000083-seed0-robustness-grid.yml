name: E000083 seed0 symlink robustness grid

on:
  push:
    branches: [research/e000051-clean-bystanders]
    paths:
      - '.github/workflows/e000083-seed0-robustness-grid.yml'
  workflow_dispatch:

jobs:
  seed0-grid:
    strategy:
      fail-fast: false
      matrix:
        include:
          - consistency: 0.10
            alt: 0.50
          - consistency: 0.20
            alt: 0.50
          - consistency: 0.25
            alt: 0.50
          - consistency: 0.10
            alt: 0.75
          - consistency: 0.20
            alt: 0.75
          - consistency: 0.25
            alt: 0.75
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SO_BOS: '1'
      SO_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r so/requirements.txt
      - name: Strict seed0 capability arm
        run: |
          mkdir -p ci-e83
          set +e
          python -m so.experiments.e000081_symlink_consistency_reader \
            --seeds 0 --steps 3000 --groups 100 \
            --consistency ${{ matrix.consistency }} --alt-supervision ${{ matrix.alt }} \
            --threads 2 --results-dir ci-e83
          rc=$?
          set -e
          echo "experiment_exit_code=$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e000083-c${{ matrix.consistency }}-a${{ matrix.alt }}
          path: ci-e83/
