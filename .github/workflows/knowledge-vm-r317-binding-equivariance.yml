name: Knowledge VM R317 Binding Equivariance

on:
  push:
    branches:
      - research/knowledge-vm-binding-equivariance-r317-20260914
  workflow_dispatch:

jobs:
  r317-binding-equivariance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SO_R317_REPORT: ci-r317/report.json
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run R317 binding-equivariant gate
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          mkdir -p ci-r317
          python -m research.r317_binding_equivariant_execution 2>&1 | tee ci-r317/stdout.log
      - name: Upload R317 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-vm-r317-binding-equivariance
          path: ci-r317/
          retention-days: 30
