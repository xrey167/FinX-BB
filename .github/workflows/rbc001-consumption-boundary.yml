name: RBC-001 consumption-boundary completeness
on:
  workflow_dispatch:
  push:
    branches: [research/rbc001-consumption-boundary-completeness]
    paths:
      - 'research_screens/rbc001/**'
      - 'so/cavi.py'
      - '.github/workflows/rbc001-consumption-boundary.yml'
permissions:
  contents: read
jobs:
  source-level-countermodels:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numerical test dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 pytest
      - name: Execute source-level countermodels and tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-rbc001/source/so ci-rbc001/source/research_screens/rbc001
          cp so/cavi.py ci-rbc001/source/so/
          cp research_screens/rbc001/*.py ci-rbc001/source/research_screens/rbc001/
          python -m research_screens.rbc001.experiment --seeds 0 1 2 --results-dir ci-rbc001 | tee ci-rbc001/run.txt
          python -m pytest -q research_screens/rbc001/test_experiment.py | tee ci-rbc001/pytest.txt
          sha256sum so/cavi.py research_screens/rbc001/*.py ci-rbc001/rbc001-results.json > ci-rbc001/sha256.txt
          python --version > ci-rbc001/environment.txt
          python -m pip freeze >> ci-rbc001/environment.txt
          uname -a >> ci-rbc001/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rbc001-consumption-boundary-countermodels
          path: ci-rbc001/
          if-no-files-found: warn
