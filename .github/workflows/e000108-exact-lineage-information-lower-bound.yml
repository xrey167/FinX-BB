name: E000108 exact lineage information lower bound

on:
  push:
    branches:
      - research/e000051-clean-bystanders
    paths:
      - "docs/novelty/e000108-exact-lineage-information-lower-bound.md"
      - "so/experiments/e000108_exact_lineage_information_lower_bound.py"
      - "so/tests/test_e000108_exact_lineage_information_lower_bound.py"
      - ".github/workflows/e000108-exact-lineage-information-lower-bound.yml"
  workflow_dispatch:

jobs:
  reduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile so/experiments/e000108_exact_lineage_information_lower_bound.py
      - name: Focused regressions
        run: python -m pytest -q so/tests/test_e000108_exact_lineage_information_lower_bound.py
      - name: Registered exact reduction
        run: |
          mkdir -p ci-e108
          python -m so.experiments.e000108_exact_lineage_information_lower_bound \
            --results-dir ci-e108 | tee ci-e108/stdout.txt
      - name: Hash evidence
        run: |
          sha256sum docs/novelty/e000108-exact-lineage-information-lower-bound.md \
            so/experiments/e000108_exact_lineage_information_lower_bound.py \
            so/tests/test_e000108_exact_lineage_information_lower_bound.py \
            > ci-e108/source-sha256.txt
          find ci-e108 -maxdepth 1 -name '*.json' -print0 | sort -z | xargs -0 -r sha256sum > ci-e108/result-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: e000108-exact-lineage-information-lower-bound
          path: ci-e108/
          if-no-files-found: error
