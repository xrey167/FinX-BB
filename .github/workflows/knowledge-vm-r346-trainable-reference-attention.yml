name: Knowledge VM R346 Trainable Reference Attention

on:
  push:
    branches:
      - research/ckca-trainable-reference-attention-r346-20260914
  workflow_dispatch:

jobs:
  r346-trainable-reference-attention:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SO_R346_REPORT: ci-r346/report.json
      SO_R346_PODS: 256
      SO_R346_TRAIN_STEPS: 1600
      SO_R346_BATCH: 512
      SO_R346_DESCRIPTORS: 6000
      SO_R346_FUTURE_WORLDS: 64
      SO_R346_UPDATES: 30000
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run R346 trainable reference-attention gate
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          mkdir -p ci-r346
          python -m research.r346_trainable_reference_valued_attention 2>&1 | tee ci-r346/stdout.log
      - name: Upload R346 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-vm-r346-trainable-reference-attention
          path: ci-r346/
          retention-days: 30
