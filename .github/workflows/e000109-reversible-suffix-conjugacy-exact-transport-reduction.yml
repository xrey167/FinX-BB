name: E000109 reversible suffix conjugacy exact transport reduction

on:
  push:
    branches:
      - research/e000051-clean-bystanders
    paths:
      - "docs/novelty/e000109-reversible-suffix-conjugacy-exact-transport-reduction.md"
      - "so/experiments/e000109_reversible_suffix_conjugacy_exact_transport_reduction.py"
      - "so/tests/test_e000109_reversible_suffix_conjugacy_exact_transport_reduction.py"
      - ".github/workflows/e000109-reversible-suffix-conjugacy-exact-transport-reduction.yml"
  workflow_dispatch:

jobs:
  reduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile so/experiments/e000109_reversible_suffix_conjugacy_exact_transport_reduction.py
      - name: Focused regressions
        run: python -m pytest -q so/tests/test_e000109_reversible_suffix_conjugacy_exact_transport_reduction.py
      - name: Registered exact reduction
        run: |
          mkdir -p ci-e109
          python -m so.experiments.e000109_reversible_suffix_conjugacy_exact_transport_reduction \
            --results-dir ci-e109 | tee ci-e109/stdout.txt
      - name: Hash evidence
        run: |
          sha256sum docs/novelty/e000109-reversible-suffix-conjugacy-exact-transport-reduction.md \
            so/experiments/e000109_reversible_suffix_conjugacy_exact_transport_reduction.py \
            so/tests/test_e000109_reversible_suffix_conjugacy_exact_transport_reduction.py \
            > ci-e109/source-sha256.txt
          find ci-e109 -maxdepth 1 -name '*.json' -print0 | sort -z | xargs -0 -r sha256sum > ci-e109/result-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: e000109-reversible-suffix-conjugacy-exact-transport-reduction
          path: ci-e109/
          if-no-files-found: error
