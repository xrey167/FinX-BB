name: Knowledge VM R329 World-Interfaced Transformer

on:
  push:
    branches:
      - research/ckca-dual-rail-transformer-r329-20260914
  workflow_dispatch:

jobs:
  r329-world-interfaced-transformer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SO_R329_REPORT: ci-r329/report.json
      SO_R329_COMPILER_STEPS: 650
      SO_R329_MONO_STEPS: 800
      SO_R329_J_STEPS: 750
      SO_R329_BATCH: 256
      SO_R329_J_BATCH: 512
      SO_R329_EVAL_BATCHES: 32
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run R329 world-interfaced Transformer gate
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          mkdir -p ci-r329
          python -m research.r329_world_interfaced_transformer 2>&1 | tee ci-r329/stdout.log
      - name: Upload R329 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-vm-r329-world-interfaced-transformer
          path: ci-r329/
          retention-days: 30
