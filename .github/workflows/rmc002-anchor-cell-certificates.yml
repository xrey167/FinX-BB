name: RMC002 anchor cell certificates
on:
  push:
    branches: [research/rmc002-anchor-cell-certificates]
    paths:
      - so/experiments/rmc002_anchor_cell_certificates.py
      - so/tests/test_rmc002_anchor_cell_certificates.py
      - .github/workflows/rmc002-anchor-cell-certificates.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 pytest==9.0.2
      - name: Execute anchored exact screen and tests
        run: |
          set -euo pipefail
          mkdir -p ci-rmc002
          python -m so.experiments.rmc002_anchor_cell_certificates --seeds 0 1 2 3 4 --output ci-rmc002/results.json | tee ci-rmc002/run.txt
          python -m pytest so/tests/test_rmc002_anchor_cell_certificates.py -q -ra | tee ci-rmc002/pytest.txt
          python -m pip freeze > ci-rmc002/environment.txt
          sha256sum so/experiments/rmc001_rounding_margin_certificates.py so/experiments/rmc002_anchor_cell_certificates.py so/tests/test_rmc002_anchor_cell_certificates.py ci-rmc002/results.json > ci-rmc002/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rmc002-anchor-cell-certificates
          path: ci-rmc002/
          if-no-files-found: error
