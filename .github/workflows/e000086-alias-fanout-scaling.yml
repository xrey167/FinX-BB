name: E000086 alias fanout lifecycle scaling
on:
  push:
    branches: [research/e000086-alias-fanout-scaling]
    paths:
      - 'so/experiments/e000086_alias_fanout_scaling.py'
      - '.github/workflows/e000086-alias-fanout-scaling.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  utility-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy 'torch>=2.2' --index-url https://download.pytorch.org/whl/cpu
      - name: Run five-seed fanout utility screen
        run: |
          mkdir -p ci-e86
          python -m so.experiments.e000086_alias_fanout_scaling \
            --seeds 0 1 2 3 4 --fanouts 1 2 4 8 16 32 64 \
            --groups 8 --n-base 256 --rounds 15 --results-dir ci-e86
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e000086-alias-fanout
          path: ci-e86/
          if-no-files-found: error
