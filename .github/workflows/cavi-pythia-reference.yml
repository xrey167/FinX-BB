name: CAVI Pythia reference-head capability
on:
  push:
    branches: [research/cavi-continuation-audit]
    paths: ['.github/workflows/cavi-pythia-reference.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2]
    env:
      SO_BOS: '1'
      SO_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install recorded CPU dependencies
        run: |
          python -m pip install 'torch==2.14.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==5.16.1' numpy pytest
          python -m pip freeze > environment.txt
          python -m py_compile so/experiments/cavi_reference_backbone.py
      - name: Original full-head capability and unchanged validity
        run: python -m so.experiments.cavi_reference_backbone --seed ${{ matrix.seed }} --backbone pythia --output results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cavi-reference-pythia-s${{ matrix.seed }}
          path: |
            results/
            environment.txt
          retention-days: 30
          if-no-files-found: error
