name: E000098 exact correction span
on:
  push:
    branches: [research/e000051-clean-bystanders]
    paths:
      - 'so/experiments/e000098_exact_correction_span.py'
      - 'docs/novelty/e000098-exact-correction-span-preregister.md'
      - '.github/workflows/e000098-exact-correction-span.yml'
  workflow_dispatch:
jobs:
  span:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: distilgpt2
            model: distilgpt2
          - label: pythia70m
            model: EleutherAI/pythia-70m
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r so/requirements.txt
      - name: Compile registered source
        run: python -m py_compile so/experiments/e000098_exact_correction_span.py
      - name: E-000098 oracle shared-span kill screen
        run: |
          mkdir -p ci-e98
          python -m so.experiments.e000098_exact_correction_span \
            --model '${{ matrix.model }}' --seeds 0 1 2 --n-cal 64 --n-test 64 \
            --seq-len 16 --payload-rms 2.0 --results-dir ci-e98 \
            | tee ci-e98/stdout.txt
      - name: Hash evidence
        run: |
          sha256sum docs/novelty/e000098-exact-correction-span-preregister.md \
            so/experiments/e000098_exact_correction_span.py \
            > ci-e98/source-sha256.txt
          find ci-e98 -maxdepth 1 -name '*.json' -print0 | sort -z | xargs -0 -r sha256sum > ci-e98/result-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: e000098-${{ matrix.label }}
          path: ci-e98/
