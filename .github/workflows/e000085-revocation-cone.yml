name: E000085 revocation cone boundary

on:
  push:
    branches:
      - research/e000085-revocation-cone
    paths:
      - 'so/experiments/e000085_revocation_cone_boundary.py'
      - '.github/workflows/e000085-revocation-cone.yml'
      - 'docs/novelty/e000085-revocation-cone-boundary.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Run five-seed revocation-cone falsification screen
        run: |
          mkdir -p ci-e85
          python -m so.experiments.e000085_revocation_cone_boundary \
            --seeds 0 1 2 3 4 \
            --channels 64 --durable-dim 32 --depth 16 --pods 32 --delete-trials 16 \
            --leak-strengths 0.0 0.002 0.01 0.05 \
            --results-dir ci-e85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e000085-revocation-cone-boundary
          path: ci-e85/
          if-no-files-found: warn
