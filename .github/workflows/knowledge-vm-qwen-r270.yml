name: Knowledge VM Qwen R270 embedding schema microkernel
on:
  push:
    branches: [research/knowledge-vm-real-gate-20260913]
    paths:
      - 'research/qwen_knowledge_vm_r270_singlepass.py'
      - '.github/workflows/knowledge-vm-qwen-r270.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qwen-r270:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      SO_R270_REPORT: ci-qwen-r270/report.json
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.48.3 tokenizers==0.21.0 safetensors==0.5.2 huggingface_hub==0.28.1
      - name: Run R270
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-qwen-r270
          python research/qwen_knowledge_vm_r270_singlepass.py 2>&1 | tee ci-qwen-r270/stdout.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-vm-qwen-r270-embedding-router
          path: ci-qwen-r270/
          retention-days: 30
          if-no-files-found: warn
