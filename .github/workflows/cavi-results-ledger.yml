name: CAVI immutable result ledger
on:
  push:
    branches: [research/cavi-continuation-audit]
    paths: ['.github/workflows/cavi-results-ledger.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/cavi-continuation-audit
      - name: Verify and retain observed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python so/experiments/cavi_collect_results.py --output research/evidence/cavi-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Append evidence only to research branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/evidence/
          git commit -m 'research: append hash-verified CAVI result snapshot; no breakthrough classification'
          git pull --rebase origin research/cavi-continuation-audit
          git push origin HEAD:research/cavi-continuation-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cavi-verified-ledger-${{ github.run_attempt }}
          path: research/evidence/cavi-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
