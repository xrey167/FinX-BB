name: Knowledge VM R333 Midlayer World Port

on:
  push:
    branches:
      - research/ckca-midlayer-world-port-r333-20260914
  workflow_dispatch:

jobs:
  r333-midlayer-world-port:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_XET: 1
      HF_HUB_DISABLE_TELEMETRY: 1
      TOKENIZERS_PARALLELISM: false
      SO_R333_REPORT: ci-r333/report.json
      SO_R333_TRAIN_PROMPTS_PER_OP: 64
      SO_R333_EVAL_PROMPTS_PER_OP: 48
      SO_R333_ENCODE_BATCH: 24
      SO_R333_PORT_STEPS: 420
      SO_R333_PORT_BATCH: 48
      SO_R333_LATE_LAYERS: 4
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.45.2 tokenizers==0.20.3 huggingface_hub==0.25.2 safetensors==0.4.5
      - name: Run R333 mid-layer pretrained World Port gate
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          mkdir -p ci-r333
          python -m research.qwen25_05b_r333_midlayer_world_port 2>&1 | tee ci-r333/stdout.log
      - name: Upload R333 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-vm-r333-midlayer-world-port
          path: ci-r333/
          retention-days: 30
