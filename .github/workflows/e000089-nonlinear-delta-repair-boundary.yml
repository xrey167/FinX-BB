name: E000089 nonlinear delta repair boundary

on:
  push:
    branches: [research/e000089-nonlinear-delta-repair-boundary]
    paths:
      - 'so/experiments/e000089_nonlinear_delta_repair_boundary.py'
      - '.github/workflows/e000089-nonlinear-delta-repair-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install numpy
      - name: Run five-seed nonlinear carrier screen
        run: |
          mkdir -p ci-e89
          python -m so.experiments.e000089_nonlinear_delta_repair_boundary \
            --seeds 0 1 2 3 4 --d 128 --steps 48 --edit-at 8 --rounds 17 \
            --results-dir ci-e89
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e000089-nonlinear-delta-repair-boundary
          path: ci-e89/
          if-no-files-found: error
