name: Knowledge VM Qwen2.5 R288 Shared Port Codec

on:
  push:
    branches:
      - research/knowledge-vm-shared-port-codec-r288-20260913
    paths:
      - research/qwen25_3b_knowledge_vm_r284_factored_ports.py
      - research/qwen25_05b_r288_shared_latent_port_codec.py
      - .github/workflows/knowledge-vm-qwen25-r288-shared-port-codec.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_XET: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  SO_R288_REPORT: ci-qwen-r288/report.json
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  qwen25-r288-shared-port-codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.45.2 tokenizers==0.20.3 huggingface_hub==0.25.2 safetensors==0.4.5
      - name: Run R288 shared latent port codec
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-qwen-r288
          python -m research.qwen25_05b_r288_shared_latent_port_codec 2>&1 | tee ci-qwen-r288/stdout.log
      - name: Upload R288 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-vm-qwen25-r288-shared-port-codec
          path: ci-qwen-r288/
          retention-days: 30
          if-no-files-found: warn
