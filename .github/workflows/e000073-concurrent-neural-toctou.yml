name: E000073 concurrent neural TOCTOU

on:
  push:
    branches: [research/e000051-clean-bystanders]
    paths:
      - 'so/cavi.py'
      - 'so/experiments/e000073_concurrent_neural_toctou.py'
      - 'so/experiments/e000070_cavi_live_symlink_boundary.py'
      - 'so/llm_adapter.py'
      - '.github/workflows/e000073-concurrent-neural-toctou.yml'
  workflow_dispatch:

jobs:
  concurrent-toctou:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r so/requirements.txt
      - name: CAVI unit semantics
        run: python -m pytest so/tests/test_cavi.py -q
      - name: E-000073 concurrent validation-consumption race
        env:
          SO_THREADS: '2'
        run: |
          mkdir -p ci-e73
          python -m so.experiments.e000073_concurrent_neural_toctou --seeds 0 --steps 1200 --groups 16 --template 9 --threads 2 --results-dir ci-e73
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e000073-concurrent-neural-toctou
          path: ci-e73/
