name: BHC001 exact coalescence
on:
  push:
    branches: [research/bhc001-exact-coalescence]
    paths:
      - so/experiments/bhc001_exact_coalescence.py
      - so/tests/test_bhc001_exact_coalescence.py
      - tools/bhc001_check_fixed_points.py
      - .github/workflows/bhc001-exact-coalescence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned CPU libraries
        run: |
          python -m pip install numpy==2.3.5 pytest==9.0.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Exact coalescence and 52-test screen
        run: |
          set -euo pipefail
          mkdir -p ci-bhc001
          python -m so.experiments.bhc001_exact_coalescence --output ci-bhc001/results.json | tee ci-bhc001/run.txt
          python -m pytest so/tests/test_bhc001_exact_coalescence.py -q -ra | tee ci-bhc001/pytest.txt
          python -O tools/bhc001_check_fixed_points.py ci-bhc001/results.json | tee ci-bhc001/independent-check.json
          python -m pip freeze > ci-bhc001/environment.txt
          sha256sum so/experiments/bhc001_exact_coalescence.py so/tests/test_bhc001_exact_coalescence.py tools/bhc001_check_fixed_points.py ci-bhc001/results.json > ci-bhc001/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bhc001-exact-coalescence
          path: ci-bhc001/
          if-no-files-found: error
