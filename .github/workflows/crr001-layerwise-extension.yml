name: CRR001 layerwise extension
on:
  push:
    branches: [research/crr001-finite-response-rank]
    paths:
      - so/experiments/crr001_layerwise_extension.py
      - so/tests/test_crr001_layerwise_extension.py
      - .github/workflows/crr001-layerwise-extension.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        model: [distilbert/distilgpt2, EleutherAI/pythia-70m]
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install numpy==2.3.5 pytest==9.0.2 transformers==4.57.6
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Independent per-layer K and V bases
        env:
          MODEL: ${{ matrix.model }}
        run: |
          set -euo pipefail
          mkdir -p ci-crr001-layerwise
          python -m so.experiments.crr001_layerwise_extension --model "$MODEL" --output-dir ci-crr001-layerwise | tee ci-crr001-layerwise/run.txt
          python -m pytest so/tests/test_crr001_finite_response_rank.py so/tests/test_crr001_layerwise_extension.py -q -ra | tee ci-crr001-layerwise/pytest.txt
          python -m pip freeze > ci-crr001-layerwise/environment.txt
          sha256sum so/experiments/crr001*.py so/tests/test_crr001*.py ci-crr001-layerwise/*.json > ci-crr001-layerwise/sha256.txt
          echo "ARTIFACT_NAME=$(echo "$MODEL" | tr / -)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crr001-layerwise-${{ env.ARTIFACT_NAME || strategy.job-index }}
          path: ci-crr001-layerwise/
          if-no-files-found: warn
