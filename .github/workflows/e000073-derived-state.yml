name: E000073 CAVI derived-state replay

on:
  push:
    branches: [research/e000051-clean-bystanders]
    paths:
      - 'so/experiments/e000073_cavi_derived_state_replay.py'
      - 'so/cavi.py'
      - 'so/llm_adapter.py'
      - '.github/workflows/e000073-derived-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derived-replay:
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r so/requirements.txt
      - name: CAVI unit semantics
        run: python -m pytest so/tests/test_cavi.py -q
      - name: E-000073 derived neural-state replay attack
        env:
          SO_THREADS: '2'
        run: |
          mkdir -p ci-e73
          python -m so.experiments.e000073_cavi_derived_state_replay \
            --seeds ${{ matrix.seed }} --steps 1200 --groups 16 --template 9 \
            --threads 2 --results-dir ci-e73
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e000073-seed-${{ matrix.seed }}
          path: ci-e73/
          if-no-files-found: warn
