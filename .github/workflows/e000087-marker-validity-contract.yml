name: E000087 marker validity contract
on:
  push:
    branches: [research/e000087-marker-validity-contract]
    paths:
      - 'so/experiments/e000087_marker_validity_contract.py'
      - '.github/workflows/e000087-marker-validity-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validity-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy
      - name: Run marker validity audit
        run: |
          mkdir -p ci-e87
          # 128D is intentionally excluded from strict rejection sampling here: under the
          # historical 0.05 proposal and unchanged 0.35 radius its acceptance is effectively
          # zero. The contract screen covers current/relevant 16D plus 32D/64D stress cases.
          python -m so.experiments.e000087_marker_validity_contract \
            --seeds 0 1 2 3 4 --dims 8 16 32 64 --draws 20000 \
            --results-dir ci-e87
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e000087-marker-validity-contract
          path: ci-e87/
          if-no-files-found: error
