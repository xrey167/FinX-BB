name: Knowledge VM Qwen real preflight

on:
  push:
    branches: [research/knowledge-vm-real-gate-20260913]
    paths:
      - 'research/knowledge_vm_qwen_preflight.py'
      - '.github/workflows/knowledge-vm-qwen-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen-real-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      SO_QWEN_REPORT: ci-qwen-preflight/report.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.48.3 tokenizers==0.21.0 safetensors==0.5.2 huggingface_hub==0.28.1
      - name: Run exact-revision pretrained Qwen preflight
        run: |
          mkdir -p ci-qwen-preflight
          python research/knowledge_vm_qwen_preflight.py | tee ci-qwen-preflight/stdout.log
      - name: Archive evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-vm-qwen-real-preflight
          path: ci-qwen-preflight/
          if-no-files-found: warn
