name: FIR001 bounded influence horizon
on:
  push:
    branches: [research/fir001-bounded-influence-horizon]
    paths:
      - so/experiments/fir001_bounded_influence_horizon.py
      - so/tests/test_fir001_bounded_influence_horizon.py
      - .github/workflows/fir001-bounded-influence-horizon.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned dependencies
        run: python -m pip install numpy==2.3.5 pytest==9.0.2
      - name: Execute exact structural screen and tests
        run: |
          set -euo pipefail
          mkdir -p ci-fir001
          python -m so.experiments.fir001_bounded_influence_horizon --output ci-fir001/results.json | tee ci-fir001/run.txt
          python -m pytest so/tests/test_fir001_bounded_influence_horizon.py -q -ra | tee ci-fir001/pytest.txt
          python -m pip freeze > ci-fir001/environment.txt
          sha256sum so/experiments/fir001_bounded_influence_horizon.py so/tests/test_fir001_bounded_influence_horizon.py ci-fir001/results.json > ci-fir001/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fir001-bounded-influence-horizon
          path: ci-fir001/
          if-no-files-found: error
