name: RMC001 rounding margin certificates
on:
  push:
    branches: [research/rmc001-rounding-margin-certificates]
    paths:
      - so/experiments/rmc001_rounding_margin_certificates.py
      - so/tests/test_rmc001_rounding_margin_certificates.py
      - .github/workflows/rmc001-rounding-margin-certificates.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned dependency
        run: python -m pip install numpy==2.3.5 pytest==9.0.2
      - name: Execute exact five-seed screen and tests
        run: |
          set -euo pipefail
          mkdir -p ci-rmc001
          python -m so.experiments.rmc001_rounding_margin_certificates --seeds 0 1 2 3 4 --output ci-rmc001/results.json | tee ci-rmc001/run.txt
          python -m pytest so/tests/test_rmc001_rounding_margin_certificates.py -q -ra | tee ci-rmc001/pytest.txt
          python -m pip freeze > ci-rmc001/environment.txt
          sha256sum so/experiments/rmc001_rounding_margin_certificates.py so/tests/test_rmc001_rounding_margin_certificates.py ci-rmc001/results.json > ci-rmc001/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rmc001-rounding-margin-certificates
          path: ci-rmc001/
          if-no-files-found: error
