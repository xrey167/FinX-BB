name: CRR001 finite response rank
on:
  push:
    branches: [research/crr001-finite-response-rank]
    paths:
      - so/experiments/crr001_finite_response_rank.py
      - so/tests/test_crr001_finite_response_rank.py
      - .github/workflows/crr001-finite-response-rank.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arm: [exact, distilgpt2, pythia70m]
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install numpy==2.3.5 pytest==9.0.2 transformers==4.57.6
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Execute selected scientific arm without soft failure
        env:
          ARM: ${{ matrix.arm }}
        run: |
          set -euo pipefail
          mkdir -p ci-crr001
          if [ "$ARM" = exact ]; then
            python -m so.experiments.crr001_finite_response_rank --output-dir ci-crr001 | tee ci-crr001/run.txt
            python -m pytest so/tests/test_crr001_finite_response_rank.py -q -ra | tee ci-crr001/pytest.txt
          elif [ "$ARM" = distilgpt2 ]; then
            python -m so.experiments.crr001_finite_response_rank --model distilbert/distilgpt2 --output-dir ci-crr001 | tee ci-crr001/run.txt
          else
            python -m so.experiments.crr001_finite_response_rank --model EleutherAI/pythia-70m --output-dir ci-crr001 | tee ci-crr001/run.txt
          fi
          python -m pip freeze > ci-crr001/environment.txt
          sha256sum so/experiments/crr001_finite_response_rank.py so/tests/test_crr001_finite_response_rank.py ci-crr001/*.json > ci-crr001/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crr001-${{ matrix.arm }}
          path: ci-crr001/
          if-no-files-found: warn
