name: E000082 late-bound cache purity

on:
  workflow_dispatch:
  push:
    branches: [research/e000082-revocation-local-persistence]
    paths:
      - 'so/experiments/e000082_late_bound_cache_purity.py'
      - '.github/workflows/e000082-late-bound-cache-purity.yml'

jobs:
  cache-purity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        model:
          - distilgpt2
          - EleutherAI/pythia-70m-deduped
    env:
      SO_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r so/requirements.txt
      - name: Run three-seed cache-purity falsification
        run: |
          mkdir -p ci-e82
          python -m so.experiments.e000082_late_bound_cache_purity \
            --model '${{ matrix.model }}' --seeds 0 1 2 \
            --payload-rms 8.0 --lengths 16 64 256 \
            --results-dir ci-e82
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e000082-${{ strategy.job-index }}
          path: ci-e82/
