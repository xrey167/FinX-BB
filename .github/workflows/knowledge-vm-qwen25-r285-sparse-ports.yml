name: Knowledge VM Qwen2.5 R285 Sparse Ports

on:
  push:
    branches:
      - research/knowledge-vm-sparse-ports-r285-20260913
    paths:
      - research/qwen25_3b_knowledge_vm_r284_factored_ports.py
      - research/qwen25_3b_knowledge_vm_r285_sparse_ports.py
      - .github/workflows/knowledge-vm-qwen25-r285-sparse-ports.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_XET: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  SO_R285_REPORT: ci-qwen-r285/report.json
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  qwen25-r285-sparse-ports:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.51.3 tokenizers==0.21.4 safetensors huggingface_hub
      - name: Run R285 layer-sparse port search
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-qwen-r285
          python -m research.qwen25_3b_knowledge_vm_r285_sparse_ports 2>&1 | tee ci-qwen-r285/stdout.log
      - name: Upload R285 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-vm-qwen25-r285-sparse-ports
          path: ci-qwen-r285/
          retention-days: 30
          if-no-files-found: warn
