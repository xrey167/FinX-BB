name: Knowledge VM R335 Transactional Lazy Delta Attention

on:
  push:
    branches:
      - research/ckca-lazy-delta-attention-r335-20260914
  workflow_dispatch:

jobs:
  r335-lazy-delta-attention:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SO_R335_REPORT: ci-r335/report.json
      SO_R335_PODS: 10000
      SO_R335_CACHES: 100000
      SO_R335_TOPK: 4
      SO_R335_DV: 8
      SO_R335_WRITES: 50000
      SO_R335_READS: 200000
      SO_R335_RACE_PROB: 0.08
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run R335 transactional lazy delta-attention gate
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          mkdir -p ci-r335
          python -m research.r335_transactional_lazy_delta_attention 2>&1 | tee ci-r335/stdout.log
      - name: Upload R335 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-vm-r335-lazy-delta-attention
          path: ci-r335/
          retention-days: 30
