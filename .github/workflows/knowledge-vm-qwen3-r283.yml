name: Knowledge VM Qwen3 R283 RoPE causal summary

on:
  push:
    branches:
      - research/knowledge-vm-real-gate-20260913
    paths:
      - 'research/qwen3_knowledge_vm_r283_rope_summary.py'
      - '.github/workflows/knowledge-vm-qwen3-r283.yml'
  workflow_dispatch:

jobs:
  qwen3-r283:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      SO_R283_REPORT: ci-qwen-r283/report.json
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.51.3 tokenizers==0.21.4 safetensors huggingface_hub
      - name: Run R283
        run: |
          set -euo pipefail
          mkdir -p ci-qwen-r283
          python -m research.qwen3_knowledge_vm_r283_rope_summary 2>&1 | tee ci-qwen-r283/stdout.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-vm-qwen3-r283-rope-summary
          path: ci-qwen-r283/
          retention-days: 30
