name: E000079 generation KV lineage race

on:
  workflow_dispatch:
  push:
    branches: [research/e000051-clean-bystanders]
    paths:
      - 'so/experiments/e000079_generation_kv_lineage_race.py'
      - 'so/cavi_snapshot.py'
      - '.github/workflows/e000079-generation-kv-lineage-race.yml'

jobs:
  kv-lineage-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        model:
          - distilgpt2
          - EleutherAI/pythia-70m-deduped
    env:
      SO_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: so/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r so/requirements.txt
      - name: Run three-seed autoregressive KV lineage race
        run: |
          mkdir -p ci-e79
          python -m so.experiments.e000079_generation_kv_lineage_race \
            --model '${{ matrix.model }}' --seeds 0 1 2 --payload-rms 4.0 \
            --results-dir ci-e79
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e000079-${{ strategy.job-index }}
          path: ci-e79/
