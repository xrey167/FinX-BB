name: E000106 region-transition witness reduction

on:
  push:
    branches:
      - research/e000051-clean-bystanders
    paths:
      - "docs/novelty/e000106-region-transition-witness-reduction.md"
      - "so/experiments/e000106_region_transition_witness_reduction.py"
      - "so/tests/test_e000106_region_transition_witness_reduction.py"
      - ".github/workflows/e000106-region-transition-witness-reduction.yml"
  workflow_dispatch:

jobs:
  reduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile so/experiments/e000106_region_transition_witness_reduction.py
      - name: Focused regressions
        run: python -m pytest -q so/tests/test_e000106_region_transition_witness_reduction.py
      - name: Registered exact reduction
        run: |
          mkdir -p ci-e106
          python -m so.experiments.e000106_region_transition_witness_reduction \
            --seed-count 32 --sessions-per-seed 64 --dims 8 --regions 12 \
            --results-dir ci-e106 | tee ci-e106/stdout.txt
      - name: Hash evidence
        run: |
          sha256sum docs/novelty/e000106-region-transition-witness-reduction.md \
            so/experiments/e000106_region_transition_witness_reduction.py \
            so/tests/test_e000106_region_transition_witness_reduction.py \
            > ci-e106/source-sha256.txt
          find ci-e106 -maxdepth 1 -name '*.json' -print0 | sort -z | xargs -0 -r sha256sum > ci-e106/result-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: e000106-region-transition-witness-reduction
          path: ci-e106/
          if-no-files-found: error
