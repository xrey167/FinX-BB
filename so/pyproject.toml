[project]
name = "so-research"
version = "0.1.0"
description = "SO — Modular Neural Operating System: experimental research code (synthetic worlds, mutable knowledge layer, Mini-Transformer, validation families)"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "torch>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["so/tests"]
